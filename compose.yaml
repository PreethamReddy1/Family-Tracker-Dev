
services:
  app:
    build: .
    container_name: travel-app
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: travel_tracker
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: travel-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: travel_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    external: true
    name: 5440e546a0181a1658a0e7e82d6f46c6dd24356e58dc127ed041086b7cb596ab

